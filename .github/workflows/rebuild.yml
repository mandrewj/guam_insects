# Rebuild and redeploy the site after every push to main that can change it: the taxonomy
# editor's commits (dataset/**), the tools' commits, code, the web app. See docs/EDITOR.md.
#
# The dataset is in the repository, so a clone is enough: no snapshot, no restore. Needs three
# repository secrets: VERCEL_TOKEN (vercel.com/account/tokens), VERCEL_ORG_ID and
# VERCEL_PROJECT_ID (site.nosync/public/.vercel/project.json on the data machine).
# Without them the job checks the dataset and the code and stops with a notice.
name: Rebuild the site

on:
  push:
    branches: [main]
    paths:
      - dataset/**
      - media/**
      - src/**
      - webapp/**
      - editor/**
      - ops/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/rebuild.yml
  workflow_dispatch:

# One rebuild at a time; a push during a rebuild queues the next (the newest wins).
concurrency:
  group: rebuild-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL: npx --yes vercel@65.4.0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install
        run: uv sync

      - name: Browser for the tests and the site check
        run: uv run playwright install --with-deps chromium

      - name: Check the dataset and the code
        run: |
          uv run guaminsects dataset check
          uv run pytest -q

      - name: Ready to deploy?
        id: ready
        run: |
          ok=true
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set in the repository's secrets: checked, not deployed."
            ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Build, check and deploy
        if: steps.ready.outputs.ok == 'true'
        run: ops/ci_rebuild.sh
