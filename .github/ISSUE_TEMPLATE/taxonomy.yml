name: Taxonomy problem
description: A name, rank, placement, synonym or duplicate that looks wrong.
labels: ["taxonomy"]
body:
  - type: input
    id: taxon
    attributes:
      label: Taxon
      description: The name (and id) of the taxon, filled in when you come from a page of the site.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page on the site.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong, and what should it be? A reference helps (a paper, the Catalogue of Life or GBIF page).
    validations:
      required: true
