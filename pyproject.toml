[project]
name = "guaminsects"
version = "0.1.0"
description = "Insects of Guam (and Micronesia): an aggregated reference to the hexapods of Micronesia"
authors = [{ name = "M. Andrew Johnston", email = "m.andrew.johnston@gmail.com" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
]

[project.scripts]
guaminsects = "guaminsects.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.ruff]
line-length = 100
cache-dir = "private.nosync/ruff_cache"   # outside iCloud
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Outside iCloud (private.nosync is never synced): a half-synced cache folder hangs pytest.
cache_dir = "private.nosync/pytest_cache"
